<!DOCTYPE html>
<html>
<head>
<title>Product Detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins', sans-serif;
    background:#DBE2DC;
}

/* PRODUCT SECTION */
.product-section{
    padding:60px 0;
}

/* PRODUCT CARD */
.product-box{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.product-box img{
    max-height:400px;
    object-fit:contain;
}

/* RELATED SECTION */
.related-section{
    padding:60px 0;
}

.related-card{
    border:none;
    border-radius:15px;
    transition:0.3s;
}

.related-card:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.related-card img{
    height:180px;
    object-fit:cover;
    border-top-left-radius:15px;
    border-top-right-radius:15px;
}

.btn-enquire{
    background:#7F543D;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

.btn-enquire:hover{
    background:#6b4533;
    color:white;
}
</style>

</head>

<body>

<!-- PRODUCT DETAIL SECTION -->
<div class="container product-section">

<div class="row align-items-center">

<div class="col-md-6 text-center">
<img src="{{ product.image.url }}" class="img-fluid rounded shadow">
</div>

<div class="col-md-6">
<div class="product-box">

<h2>{{ product.name }}</h2>

<p>
{{ product.description }}
</p>

<a href="{% url 'login' %}" class="btn btn-primary">
Login to Enquire
</a>

</div>
</div>

</div>
</div>


<!-- RELATED PRODUCTS SECTION -->
<div class="container related-section">

<h3 class="mb-4 text-center">You May Also Like</h3>

<div class="row g-4">

{% for p in related_products %}

<div class="col-md-3">
<div class="card related-card shadow-sm">

<img src="{{ p.image.url }}" class="img-fluid">

<div class="card-body text-center">

<h6>{{ p.name }}</h6>

<a href="{% url 'product_detail' p.id %}"
class="btn btn-sm btn-outline-dark">
View
</a>

</div>
</div>
</div>

{% endfor %}

</div>
</div>

</body>
</html>
