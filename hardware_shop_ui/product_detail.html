<!DOCTYPE html>
<html>
<head>
<title>Product Detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins', sans-serif;
    background:#DBE2DC;
}

/* PRODUCT SECTION */
.product-section{
    padding:60px 0;
}

/* PRODUCT CARD */
.product-box{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.product-box img{
    max-height:400px;
    object-fit:contain;
}

/* RELATED SECTION */
.related-section{
    padding:60px 0;
}

.related-card{
    border:none;
    border-radius:15px;
    transition:0.3s;
}

.related-card:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.related-card img{
    height:180px;
    object-fit:cover;
    border-top-left-radius:15px;
    border-top-right-radius:15px;
}

.btn-enquire{
    background:#7F543D;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

.btn-enquire:hover{
    background:#6b4533;
    color:white;
}
</style>

</head>

<body>

<!-- PRODUCT DETAIL SECTION -->
<div class="container product-section">

<div class="row align-items-center">

<div class="col-md-6 text-center">
<img id="productImage" class="img-fluid rounded shadow">
</div>

<div class="col-md-6">
<div class="product-box">

<h2 id="productName"></h2>

<p id="productDesc">

</p>

<img id="productImage" width="300">


<a href="login.html" class="btn btn-primary" onclick="storeProduct()">
Login to Enquire
</a>



</div>
</div>

</div>
</div>


<!-- RELATED PRODUCTS SECTION -->
<div class="container related-section">

<h3 class="mb-4 text-center">You May Also Like</h3>

<div class="row g-4">

<div class="col-md-3">
<div class="card related-card shadow-sm">
    <div class="product-image">
    <img src="images/hammer.jpg" class="img-fluid">
</div>
<div class="card-body text-center">
<h6>Hammer</h6>
<a href="product_detail.html?name=Hammer&image=hammer.png&desc=Durable steel hammer designed for precision striking."
class="btn btn-sm btn-outline-dark">View</a>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card related-card shadow-sm">
<div class="product-image">
    <img src="images/wrench.jpg" class="img-fluid">
</div>

<div class="card-body text-center">
<h6>Adjustable Wrench</h6>
<a href="product_detail.html?name=Adjustable Wrench&image=wrench.jpg&desc=Heavy-duty adjustable wrench for tightening and loosening bolts."
class="btn btn-sm btn-outline-dark">View</a>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card related-card shadow-sm">
<div class="product-image">
    <img src="images/cutter.jpg" class="img-fluid">
</div>

<div class="card-body text-center">
<h6>End Mill Cutter</h6>
<a href="product_detail.html?name=End Mill Cutter&image=cutter.jpg&desc=Precision cutting tool ideal for milling operations."
class="btn btn-sm btn-outline-dark">View</a>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card related-card shadow-sm">
<div class="product-image">
    <img src="images/grinding.jpg" class="img-fluid">
</div>

<div class="card-body text-center">
<h6>Grinding Wheels</h6>
<a href="product_detail.html?name=Grinding Wheels&image=grinding.jpg&desc=High-speed grinding wheels suitable for finishing."
class="btn btn-sm btn-outline-dark">View</a>
</div>
</div>
</div>

</div>
</div>


<!-- SCRIPT FOR DYNAMIC PRODUCT LOAD -->
<script>
const params = new URLSearchParams(window.location.search);

const name = params.get("name");
const image = params.get("image");
const desc = params.get("desc");

document.getElementById("productName").innerText = name;
document.getElementById("productDesc").innerText = desc;
document.getElementById("productImage").src = "images/" + image;

// Update Enquire Button dynamically
document.getElementById("enquireBtn").href =
`login.html?next=enquire.html&name=${encodeURIComponent(name)}&image=${image}&desc=${encodeURIComponent(desc)}`;
</script>
<script>
function storeProduct(){
    const product = {
        name: document.getElementById("productName").innerText,
        desc: document.getElementById("productDesc").innerText,
        image: document.getElementById("productImage").src
    };

    localStorage.setItem("selectedProduct", JSON.stringify(product));
}
</script>
<script>
function storeProduct(){

    const name = document.getElementById("productName").innerText;
    const desc = document.getElementById("productDesc").innerText;
    const image = document.getElementById("productImage").getAttribute("src");

    const product = {
        name: name,
        desc: desc,
        image: image
    };

    localStorage.setItem("selectedProduct", JSON.stringify(product));
}
</script>
