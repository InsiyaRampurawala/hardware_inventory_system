<!DOCTYPE html>
<html>
<head>
<title>Product Enquiry</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
}

/* BACKGROUND WITH OVERLAY */
.enquire-bg{
    min-height:100vh;
    background:
        linear-gradient(rgba(51,87,101,0.75), rgba(51,87,101,0.75)),
        url("images/Background.png") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ENQUIRE CARD */
.enquire-card{
    background:#DBE2DC;
    padding:40px;
    border-radius:18px;
    width:100%;
    max-width:480px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.enquire-card h3{
    font-weight:600;
    margin-bottom:10px;
}

.enquire-card p{
    color:#333;
}

/* BUTTON */
.btn-whatsapp{
    background:#25D366;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    font-weight:500;
    border:none;
    text-decoration:none;
}

.btn-whatsapp:hover{
    background:#1ebe5d;
    color:white;
}
</style>

</head>

<body>

<div class="enquire-bg">

<div class="enquire-card">

<h3>Product Enquiry</h3>

<p class="mb-2">You are enquiring about:</p>

<h5 class="mb-3">Drill Machine</h5>

<p class="mb-4">
Our team will assist you with pricing, availability, and delivery details.
</p>

<a
href="https://wa.me/919009667153?text=Hello%20I%20am%20interested%20in%20the%20Drill%20Machine.%20Please%20share%20details."
class="btn-whatsapp">
Enquire Now on WhatsApp
</a>

</div>

</div>

</body>
</html>
