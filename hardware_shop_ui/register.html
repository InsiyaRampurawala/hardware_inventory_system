<!DOCTYPE html>
<html>
<head>
<title>Create Account</title>
{% load static %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
}

/* BACKGROUND WITH OVERLAY */
.auth-bg{
    min-height:100vh;
    background:
        linear-gradient(rgba(51,87,101,0.75), rgba(51,87,101,0.75)),
        url("images/login-pg-bg.png") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* REGISTER CARD */
.auth-card{
    background:#DBE2DC;
    padding:35px;
    border-radius:16px;
    width:100%;
    max-width:520px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.auth-card h3{
    text-align:center;
    margin-bottom:25px;
    font-weight:600;
}

/* INPUTS */
.auth-card input,
.auth-card textarea{
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}

.auth-card textarea{
    resize:none;
}

/* BUTTON */
.btn-register{
    background:#7F543D;
    color:white;
    padding:12px;
    border-radius:8px;
    border:none;
    font-weight:500;
}

.btn-register:hover{
    background:#6b4532;
}

</style>
</head>

<body>

<div class="auth-bg">

<div class="auth-card">

<h3>Create Account</h3>

<form>

<div class="row g-3">

<div class="col-md-6">
<input type="text" class="form-control" placeholder="First Name" required>
</div>

<div class="col-md-6">
<input type="text" class="form-control" placeholder="Last Name" required>
</div>

<div class="col-md-6">
<input type="text" class="form-control" placeholder="Contact Number" required>
</div>

<div class="col-md-6">
<input type="email" class="form-control" placeholder="Email" required>
</div>

<div class="col-md-12">
<textarea class="form-control" rows="2" placeholder="Address" required></textarea>
</div>

<div class="col-md-12">
<input type="password" class="form-control" placeholder="Password" required>
</div>

<div class="col-md-12 mt-2">
<button type="submit" class="btn btn-register w-100">
Register
</button>
</div>

</div>

</form>

<div class="text-center mt-3">
<a href="login.html">Already have an account?</a>
</div>

</div>

</div>

</body>
</html>

<script>
document.querySelector("form").addEventListener("submit", function(e){
    e.preventDefault();
    window.location.href = "enquire.html";
});
</script>
