<!DOCTYPE html>
<html>

<head>
<title>Product Detail</title>
<link rel="stylesheet" href="admin_style.css">
</head>

<body>
<div class="product-detail-container">

    <div class="product-image">
        <img id="productImage">
    </div>

    <div class="product-info">
        <h2 id="productName"></h2>
        <p id="productDesc"></p>

        <a href="login.html?redirect=enquire.html">
    <button class="enquire-btn">Enquire Now</button>
</a>
    </div>

</div>
</div>


<h2 class="suggest-title">You May Also Like</h2>

<div class="suggest-grid">

    <div class="suggest-card">
        <img src="images/drill.jpg">
        <p>Drill Machine</p>
    </div>

    <div class="suggest-card">
        <img src="images/wrench.jpg">
        <p>Wrench</p>
    </div>

    <div class="suggest-card">
        <img src="images/blades.jpg">
        <p>Blades</p>
    </div>

    <div class="suggest-card">
        <img src="images/grinding.jpg">
        <p>Grinding Tool</p>
    </div>

</div>



<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("productName").innerText = params.get("name");
document.getElementById("productDesc").innerText = params.get("desc");
document.getElementById("productImage").src = params.get("image");

</script>
