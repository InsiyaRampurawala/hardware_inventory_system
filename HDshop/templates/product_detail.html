{% load static %}
<!DOCTYPE html>
<html>

<head>
<title>Product Detail</title>
<link rel="stylesheet" href="{% static 'css/admin_style.css' %}">
</head>

<body>
<div class="product-detail-container">

    <div class="product-image">
        
       
    </div>

    <div class="product-info">
       <h2>{{ name }}</h2>

<img src="{% static image %}" width="200">

<p>{{ desc }}</p>

        <a href="{% url 'login' %}?redirect=e{% url 'enquire' %}">
    <button class="enquire-btn">Enquire Now</button>
</a>
    </div>

</div>
</div>


<h2 class="suggest-title">You May Also Like</h2>

<div class="suggest-grid">

    <div class="suggest-card">
        <img src="{% static 'images/drill.jpg' %}">
        <p>Drill Machine</p>
    </div>

    <div class="suggest-card">
        <img src="{% static 'images/wrench.jpg' %}">
        <p>Wrench</p>
    </div>

    <div class="suggest-card">
        <img src="{% static 'images/blades.jpg' %}">
        <p>Blades</p>
    </div>

    <div class="suggest-card">
        <img src="{% static 'images/grinding.jpg' %}">
        <p>Grinding Tool</p>
    </div>

</div>



<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("productName").innerText = params.get("name");
document.getElementById("productDesc").innerText = params.get("desc");
document.getElementById("productImage").src = params.get("image");

</script>
