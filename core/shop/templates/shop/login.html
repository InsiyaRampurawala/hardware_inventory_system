<!DOCTYPE html>
<html>
<head>
<title>Login</title>
{% load static %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

html, body {
height:100%;
margin:0;
}

body{
background-image:url('images/login-pg-bg.png');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* Overlay */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.25);
}

/* Center content */

.login-container{
position:relative;
z-index:2;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
}

.login-card{
    width:350px;
    border-radius:12px;
    background:#DBE2DC;
    margin-top: 80px;   /* pushes card lower under the title */
}
.login-card label{
    color:#335765;
    font-weight:500;
}

</style>


</head>

<body>

<div class="overlay"></div>

<div class="login-container">

<div class="card p-4 shadow login-card">

<form method="POST" autocomplete="off">
    {% csrf_token %}
    <input type="text" name="fakeuser" style="display:none">
    <input type="password" name="fakepass" style="display:none">
    <div class="mb-3">
        <input type="text" name="login_email" autocomplete="off" class="form-control" placeholder="Username">
    </div>

    <div class="mb-3">
        <input type="password" name="login_password" autocomplete="new-password" class="form-control" placeholder="Password required">
    </div>

    <button type="submit" class="btn btn-dark w-100">Login</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

</div>

</div>

</body>
</html>


{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<script>
window.onload = function() {
    document.querySelector("form").reset();
};
</script>
